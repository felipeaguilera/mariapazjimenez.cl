backend:
  name: git-gateway
  branch: main

media_folder: public/assets
public_folder: /assets

locale: es

collections:
  - name: "home"
    label: "Página de inicio"
    files:
      - label: "Contenido del inicio"
        name: "home"
        file: "src/data/home.json"
        fields:
          - label: "Texto Quién soy"
            name: "about_text"
            widget: "text"
            hint: "3–5 líneas. Aparece en la sección 'Quién soy' justo después del hero. Puedes escribirlo en primera o tercera persona."

          - label: "Introducción (hero)"
            name: "hero_intro"
            widget: "text"
            hint: "Tu presentación breve. 2–3 líneas, primera persona."

          - label: "Título de la sección Trabaja conmigo"
            name: "work_title"
            widget: "string"
            hint: "Ej: Trabaja con María Paz Jiménez"

          - label: "Áreas de trabajo"
            name: "work_cards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - label: "Descripción"
                name: "desc"
                widget: "text"
                hint: "2–3 líneas describiendo este área."
              - label: "Fotos del área"
                name: "images"
                widget: "list"
                hint: "Agrega o quita fotos de esta sección. Se muestran en orden aleatorio, salvo la que marques como portada."
                summary: "{{fields.src}}"
                fields:
                  - { label: "Foto", name: "src", widget: "image" }
                  - label: "Portada fija"
                    name: "cover"
                    widget: "boolean"
                    default: false
                    hint: "Actívalo en una sola foto de la sección para que sea siempre la primera en aparecer. En el resto, déjalo apagado."
                  - label: "Encuadre"
                    name: "position"
                    widget: "select"
                    default: "center"
                    options:
                      - { label: "Centro", value: "center" }
                      - { label: "Izquierda", value: "left" }
                      - { label: "Derecha", value: "right" }
                    hint: "Solo se nota en fotos horizontales anchas. Define qué parte de la foto se ve dentro del marco vertical."

          - label: "Descripción del podcast"
            name: "podcast_desc"
            widget: "text"
            hint: "2–3 líneas sobre el podcast Vinos con Marypepa."

  - name: "trayectoria"
    label: "Trayectoria"
    files:
      - label: "Contenido de trayectoria"
        name: "trayectoria"
        file: "src/data/trayectoria.json"
        fields:
          - label: "Subtítulo de la página"
            name: "subtitle"
            widget: "string"
            hint: "Una línea que resume tu carrera."

          - label: "Bloques de carrera"
            name: "career"
            widget: "list"
            summary: "{{fields.period}} — {{fields.title}}"
            fields:
              - { label: "Período", name: "period", widget: "string", hint: "Ej: 1999 · 2001" }
              - { label: "Empresa / Proyecto", name: "title", widget: "string" }
              - label: "Descripción corta"
                name: "desc"
                widget: "text"
                hint: "2–3 líneas de resumen. Siempre visible."
              - label: "Texto extendido (opcional)"
                name: "extended_text"
                widget: "text"
                required: false
                hint: "Si tienes un texto más largo (artículo, crónica), pégalo aquí. Aparece con botón 'Leer más'."
              - label: "Fotos"
                name: "images"
                widget: "list"
                hint: "Agrega o quita fotos de esta etapa. Se muestran en orden aleatorio, salvo la que marques como portada."
                summary: "{{fields.src}}"
                fields:
                  - { label: "Foto", name: "src", widget: "image" }
                  - label: "Portada fija"
                    name: "cover"
                    widget: "boolean"
                    default: false
                    hint: "Actívalo en una sola foto de esta etapa para que sea siempre la primera en aparecer. En el resto, déjalo apagado."
                  - label: "Encuadre"
                    name: "position"
                    widget: "select"
                    default: "center"
                    options:
                      - { label: "Centro", value: "center" }
                      - { label: "Izquierda", value: "left" }
                      - { label: "Derecha", value: "right" }
                    hint: "Solo se nota en fotos horizontales anchas. Define qué parte de la foto se ve dentro del marco vertical."
